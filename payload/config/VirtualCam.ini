[vCam]
; Compatibility profile for the previously working Weixin interface.
TopDown=0
FlipY=0
SwapUV=0
YUY2=1
SrcW=0
SrcH=0
SrcFps=0
; 1 preserves aspect ratio with padding. 0 retains legacy stretch.
Fit=1
; 1: area reduction / bilinear enlargement. 0: legacy nearest neighbour.
Quality=1
Log=0
